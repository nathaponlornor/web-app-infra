name: Terragrunt Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm infrastructure destruction'
        required: true
        type: string
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.7.0"
  TG_VERSION: "0.55.0"
  AWS_REGION: "ap-southeast-1"

jobs:
  destroy:
    name: Terragrunt Destroy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: inputs.confirm_destroy == 'destroy'

    steps:
      - name: Confirm Destruction
        run: |
          echo "⚠️  DESTROYING all infrastructure in '${{ inputs.environment }}' environment"
          echo "Account: 176501510816"
          echo "Region: ${{ env.AWS_REGION }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terragrunt Destroy All
        working-directory: live/${{ inputs.environment }}
        run: terragrunt run-all destroy --terragrunt-non-interactive
